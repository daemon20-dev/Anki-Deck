<!-- ░░░ NIGHT SCENE (decorative background) ░░░ -->
<div id="gm-scene" aria-hidden="true">
  <div class="gm-layer gm-stars"></div>
  <div class="gm-layer gm-stars gm-stars--near"></div>
  <div class="gm-layer">
    <span class="gm-sparkle"></span><span class="gm-sparkle"></span>
    <span class="gm-sparkle"></span><span class="gm-sparkle"></span>
  </div>
  <div class="gm-moon"></div>
  <div class="gm-shooting"></div>
  <div class="gm-clouds gm-clouds--high"></div>
  <div class="gm-clouds gm-clouds--low"></div>
  <div class="gm-layer gm-hills gm-hills--far"></div>
  <div class="gm-layer gm-hills gm-hills--mid"></div>
  <div class="gm-layer gm-mist"></div>
  <div class="gm-layer gm-hills gm-hills--near"></div>
  <div class="gm-layer gm-fireflies">
    <span class="gm-firefly"></span><span class="gm-firefly"></span><span class="gm-firefly"></span>
    <span class="gm-firefly"></span><span class="gm-firefly"></span><span class="gm-firefly"></span>
    <span class="gm-firefly"></span>
  </div>
  <div class="gm-layer gm-vignette"></div>
</div>

<!-- ░░░ GAME PANEL (FRONT) ░░░ -->
<div id="gm-panel" class="gm-front">

  <!-- CARD CONTENT -->
  <div id="gm-content">
    <div id="gm-question" class="gm-block">{{Front}}</div>
  </div>

  <!-- FOOTER: explanation toggle -->
  <div id="gm-footer">
    <button id="gm-expl-btn" type="button" aria-controls="gm-expl-anim-wrap" aria-expanded="false" disabled>
      Explanation <span class="gm-kbd">H</span>
    </button>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ── Persistent background ──
     Anki swaps the card HTML on every flip. Moving the first scene out
     of the card container (to <body>) means it is never torn down, so
     the sky never restarts or jumps between front, back and next card.
     Fresh copies from later renders are simply discarded. */
  var live = document.querySelector('.gm-scene-live');
  var fresh = document.querySelector('#gm-scene:not(.gm-scene-live)');
  if (live) {
    if (fresh) fresh.parentNode.removeChild(fresh);
  } else if (fresh) {
    // Shared clock: keeps phase consistent on clients that reload the page per side.
    fresh.style.setProperty('--gm-clock', -((Date.now() / 1000) % 86400).toFixed(2) + 's');
    fresh.classList.add('gm-scene-live');
    document.body.insertBefore(fresh, document.body.firstChild);
  }
}());
</script>
