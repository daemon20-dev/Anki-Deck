<script>
(function () {
  /* Keep exactly one card on screen: this template's own stage (the
     element just before this script). Any other #gm-stage — e.g. one
     left in <body> by an earlier version of this template — is removed,
     so no "ghost" copy of a previous card can show through. */
  var me = document.currentScript && document.currentScript.previousElementSibling;
  if (!me || me.id !== 'gm-stage') return;
  var all = document.querySelectorAll('#gm-stage');
  for (var i = 0; i < all.length; i++) {
    if (all[i] !== me) all[i].parentNode.removeChild(all[i]);
  }
}());
</script>
