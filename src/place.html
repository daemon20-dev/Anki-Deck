<script>
(function () {
  /* ── Always-centred card ──
     The card is centred on its *current* height. A ResizeObserver
     re-centres it on every frame its size changes (the answer sliding
     open, the explanation expanding, images loading), so it grows evenly
     up and down from the middle of the screen instead of jumping.

     On the back the answer starts collapsed, so the first frame matches
     the front exactly; the card then glides to its new centre as the
     answer opens. Taller-than-screen cards start at the top and scroll. */
  function viewportHeight() {
    return (window.visualViewport && window.visualViewport.height) ||
      window.innerHeight || document.documentElement.clientHeight || 0;
  }

  window.gmPlaceCard = function () {
    var panel = document.getElementById('gm-panel');
    var vh = viewportHeight();
    if (!panel || !vh) return;

    var px = function (v) { return parseFloat(v) || 0; };
    var current = px(getComputedStyle(panel).marginTop);

    // Untransformed page position of the panel (ignores entrance animation).
    var top = 0;
    for (var el = panel; el; el = el.offsetParent) top += el.offsetTop;

    var target = Math.max(16, Math.round((vh - panel.offsetHeight) / 2));
    var margin = Math.round(current + target - top);
    if (Math.abs(margin - current) >= 1) panel.style.marginTop = margin + 'px';
  };

  var place = function () { window.gmPlaceCard(); };
  place();

  // Follow every size change of the card (Anki desktop reuses the page,
  // so drop the observer that belonged to the previous card first).
  if (window.gmPanelObserver) window.gmPanelObserver.disconnect();
  var panel = document.getElementById('gm-panel');
  if (panel && window.ResizeObserver) {
    window.gmPanelObserver = new ResizeObserver(place);
    window.gmPanelObserver.observe(panel);
  }

  // Safety nets for when the page itself settles later.
  if (window.requestAnimationFrame) requestAnimationFrame(place);
  if (document.readyState !== 'complete') window.addEventListener('load', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  if (window.onShownHook && window.onShownHook.push) window.onShownHook.push(place); // Anki desktop

  if (!window.gmPlaceBound) {
    window.gmPlaceBound = true;
    window.addEventListener('resize', place);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', place);
  }
}());
</script>
