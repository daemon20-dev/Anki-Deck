<script>
(function () {
  /* ── One living background ──
     Runs right after the scene markup, before the first paint.
     • Anki desktop swaps the card HTML on every flip / card. The first
       scene is moved out to <body> and reused, so it is never rebuilt:
       only the card in the middle changes.
     • If the template was edited, the new scene carries a different
       data-version and replaces the old live one (keeping its clock).
     • Clients that reload the whole page (AnkiDroid) get a scene whose
       animations are offset by the wall clock, so every layer resumes
       exactly where the previous page left it. */
  // Retire the old script-based centring from earlier versions of this
  // template (still alive on a reused Anki desktop page after an update).
  if (window.gmPanelObserver) window.gmPanelObserver.disconnect();
  window.gmPlaceCard = function () {};

  var live = document.querySelector('.gm-scene-live');
  var fresh = document.querySelector('#gm-scene:not(.gm-scene-live)');
  if (!fresh) return;
  if (live) {
    if (live.getAttribute('data-version') === fresh.getAttribute('data-version')) {
      fresh.parentNode.removeChild(fresh);
      return;
    }
    live.parentNode.removeChild(live);   // outdated scene from before an edit
  }
  fresh.style.setProperty('--gm-clock', -((Date.now() / 1000) % 86400).toFixed(2) + 's');
  fresh.classList.add('gm-scene-live');
  document.body.insertBefore(fresh, document.body.firstChild);
}());
</script>

<!-- ░░░ CLOZE PANEL (BACK) ░░░  fields: Text, Back Extra
     Same box as the front: the blank turns into the answer in place,
     and the box extends downward to reveal Back Extra inside it. -->
<!-- Full-screen stage: centres the card on any screen, scrolls if it is taller -->
<div id="gm-stage">
<div id="gm-panel" class="gm-back gm-cloze">
  <div id="gm-content">
    <div id="gm-question" class="gm-block">
      <div class="gm-cloze-text">{{cloze:Text}}</div>

      {{#Back Extra}}
      <div id="gm-back-reveal" class="gm-collapse">
        <div class="gm-collapse-inner">
          <div class="gm-cloze-extra">{{Back Extra}}</div>
        </div>
      </div>
      {{/Back Extra}}
    </div>
  </div>
</div>
</div>

<script>
(function () {
  /* Keep exactly one card on screen: this template's own stage (the
     element just before this script). Any other #gm-stage — e.g. one
     left in <body> by an earlier version of this template — is removed,
     so no "ghost" copy of a previous card can show through. */
  var me = document.currentScript && document.currentScript.previousElementSibling;
  if (!me || me.id !== 'gm-stage') return;
  var all = document.querySelectorAll('#gm-stage');
  for (var i = 0; i < all.length; i++) {
    if (all[i] !== me) all[i].parentNode.removeChild(all[i]);
  }
}());
</script>
