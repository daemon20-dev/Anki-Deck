<script>
(function () {
  /* ── One living background ──
     Runs right after the scene markup, before the first paint.
     • Anki desktop swaps the card HTML on every flip / card. The first
       scene is moved out to <body> and reused, so it is never rebuilt:
       only the card in the middle changes.
     • Clients that reload the whole page (AnkiDroid) get a scene whose
       animations are offset by the wall clock, so every layer resumes
       exactly where the previous page left it. */
  var live = document.querySelector('.gm-scene-live');
  var fresh = document.querySelector('#gm-scene:not(.gm-scene-live)');
  if (!fresh) return;
  if (live) {
    fresh.parentNode.removeChild(fresh);
    return;
  }
  fresh.style.setProperty('--gm-clock', -((Date.now() / 1000) % 86400).toFixed(2) + 's');
  fresh.classList.add('gm-scene-live');
  document.body.insertBefore(fresh, document.body.firstChild);
}());
</script>

<!-- ░░░ GAME PANEL (BACK) ░░░ -->
<div id="gm-panel" class="gm-back">

  <!-- CARD CONTENT -->
  <div id="gm-content">
    <div id="gm-question" class="gm-block">{{Front}}</div>

    <!-- Seamless answer reveal (pure CSS) -->
    <div id="gm-back-reveal" class="gm-collapse">
      <div class="gm-collapse-inner">
        <div id="gm-answer" class="gm-block">{{Back}}</div>
      </div>
    </div>

    <!-- Explanation (only rendered when the field has content) -->
    {{#Explanation}}
    <div id="gm-expl-anim-wrap" class="gm-collapse">
      <div class="gm-collapse-inner">
        <div id="gm-expl-body" class="gm-block">{{Explanation}}</div>
      </div>
    </div>
    {{/Explanation}}
  </div>

  <!-- FOOTER: explanation toggle -->
  <div id="gm-footer">
    <button id="gm-expl-btn" type="button" aria-controls="gm-expl-anim-wrap" aria-expanded="false" disabled>
      Explanation <span class="gm-kbd">H</span>
    </button>
  </div>

</div>

<script>
(function () {
  /* ── Vertical centring that never moves the question ──
     The card is centred using its *front-side* height (question + footer)
     on both sides, so on the back the question sits exactly where it was
     and the answer opens below it.

     It runs immediately (before first paint) and again whenever the page
     settles further: next frame, window load, fonts ready, images loaded,
     Anki's "card shown" hook and resizes. Each run is idempotent, so if
     the first measurement was already right nothing moves. */
  function viewportHeight() {
    return (window.visualViewport && window.visualViewport.height) ||
      window.innerHeight || document.documentElement.clientHeight || 0;
  }

  window.gmPlaceCard = function () {
    var panel = document.getElementById('gm-panel');
    var q = document.getElementById('gm-question');
    var footer = document.getElementById('gm-footer');
    var vh = viewportHeight();
    if (!panel || !q || !footer || !vh) return;

    var px = function (v) { return parseFloat(v) || 0; };
    var ps = getComputedStyle(panel);
    var frontHeight =
      px(ps.paddingTop) + px(ps.paddingBottom) +
      px(ps.borderTopWidth) + px(ps.borderBottomWidth) +
      q.offsetHeight + footer.offsetHeight + px(getComputedStyle(footer).marginTop);

    // Untransformed page position of the panel (ignores entrance animation).
    var top = 0;
    for (var el = panel; el; el = el.offsetParent) top += el.offsetTop;

    var target = Math.max(16, Math.round((vh - frontHeight) / 2));
    var margin = Math.round(px(ps.marginTop) + target - top);
    if (Math.abs(margin - px(ps.marginTop)) >= 1) panel.style.marginTop = margin + 'px';
  };

  var place = function () { window.gmPlaceCard(); };
  place();

  if (window.requestAnimationFrame) requestAnimationFrame(place);
  if (document.readyState !== 'complete') window.addEventListener('load', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  if (window.onShownHook && window.onShownHook.push) window.onShownHook.push(place); // Anki desktop

  var imgs = document.querySelectorAll('#gm-question img');
  for (var i = 0; i < imgs.length; i++) {
    if (!imgs[i].complete) imgs[i].addEventListener('load', place);
  }
  if (!window.gmPlaceBound) {
    window.gmPlaceBound = true;
    window.addEventListener('resize', place);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', place);
  }
}());
</script>

<!-- EXPLANATION TOGGLE · ANKIDROID USER ACTION · DESKTOP HOTKEY -->
<script>
(function () {
  'use strict';

  /* ── Explanation toggle ──
     Looks elements up on every call, so it never holds on to a
     stale card (Anki desktop reuses the same page between cards). */
  window.gmToggleExplanation = function (force) {
    var wrap = document.getElementById('gm-expl-anim-wrap');
    var btn = document.getElementById('gm-expl-btn');
    if (!wrap) return;

    var open = typeof force === 'boolean' ? force : !wrap.classList.contains('is-open');
    wrap.classList.toggle('is-open', open);
    if (btn) {
      btn.classList.toggle('gm-expl-open', open);
      btn.setAttribute('aria-expanded', String(open));
    }
  };

  var btn = document.getElementById('gm-expl-btn');
  if (btn && document.getElementById('gm-expl-anim-wrap')) {
    btn.disabled = false;
    btn.addEventListener('click', function () { window.gmToggleExplanation(); });
  }

  /* ── AnkiDroid: bind to "User Action 1" ── */
  window.userJs1 = function () { window.gmToggleExplanation(); };

  /* ── Desktop hotkey: H (registered once per page) ── */
  if (!window.gmExplHotkeyBound) {
    window.gmExplHotkeyBound = true;
    document.addEventListener('keyup', function (e) {
      var t = e.target;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.code === 'KeyH' || e.key === 'h' || e.key === 'H') window.gmToggleExplanation();
    });
  }
}());
</script>
